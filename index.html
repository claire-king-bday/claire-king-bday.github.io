<!DOCTYPE html>
<html lang="en">
<head>
    <!-- stuff about the page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>claire's 21st!!!</title>
    <link rel="icon" type="image/png" href="old-claire-king/sun-sticky.png">
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">

    
</head>

<!-- stuff you see on the page -->
<body>
    <div class="page"> <!-- div is a container to hold other elements. lets you style / position a whole group at once. -->
        <!-- basically like doing "group" on a set in photo editing -->
    <header>
        <h2> you are invited to</h2>
        <h1> claire king's </h1>
        <h3>super special 21st birthday party!</h3>
    </header>

    <img class="freephoto" src="flowers/light-pink.png" alt="star"
        style="width: 50px; top: 26%; left: 10%; transform: rotate(-10deg);">

    <img class="freephoto" src="flowers/sunset.png" alt="star"
        style="width: 50px; top: 26%; right: 10%; transform: rotate(-10deg);">

    <img class="freephoto" src="flowers/white-dark-blue.png" alt="white dark blue flower"
        style="width: 50px; top: 26%; left: 20%; transform: rotate(-10deg);">

    <img class="freephoto" src="flowers/light-purple.png" alt="light purple flower"
        style="width: 50px; top: 26%; right: 20%; transform: rotate(-10deg);">
    
    <!-- <img class="photo photo1" src="flowers/midnight-lavender.png" alt="star"
            style="width: 50px; top: 26%; left: 40%; transform: rotate(-10deg);"> -->

    
    <!-- use percentages (or vw / vh) instead of fixed points for position 
         percentages scales with the container
         vw/vh are relative to the "viewport" rather than the container. useful oif the image's parent
         isn't the full page-->
    
    <!-- percentages depend on the parent container actually resizing responsively... if parent container
         itself is fixed width, switching the image to percent won't help-->

    <main>

        <!-- Freeform collage images -->
         <!-- these images are positioned relative to the nearest positioned parent-->
        <img class="photo photo1" src="claire-king/sequin-star.png" alt="star"
            style="width: 150px; top: 150px; left: 80px; transform: rotate(-10deg);">

        <img class="photo photo2" src="claire-king/sequin-star.png" alt="star"
            style="width: 150px; top: 350px; right: 30px; transform: rotate(-10deg);">

        <button>Press to take your drag quiz!</button>
        <p>you must take it in order to sign the guestbook!</p>

        <img id="claire-photo" src="2.png" alt="clairey!">
        <!-- HTML does not automatically shrink images to fit their parent container. -->
    </main>
    </div>


<script src="script.js"></script>
</body>
</html>
